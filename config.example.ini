; Copy this file to config.ini and fill in the values before starting the service.
[ddns]
hostname = example.com
hostname_2 =
hostname_3 =
username = your-strato-username
password = your-strato-password
update_ipv6 = false
timeout_seconds = 10
retries = 3
interval_seconds = 300

[mail]
enabled = false
host = smtp.example.com
port = 587
username = your-smtp-username
password = your-smtp-password
sender = sender@example.com
recipient = recipient@example.com
starttls = true
recovery_mail = true

[logging]
level = INFO
